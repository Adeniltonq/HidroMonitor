name: hidromonitor
description: "HidroMonitor — monitor de caixa d'água (leitura de telemetria e configuração de parâmetros)."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  provider: ^6.1.5+1
  go_router: ^18.1.1
  fl_chart: ^1.3.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  archive: ^4.5.2
  flutter_blue_plus: ^2.3.14
  permission_handler: ^12.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Ícone do app (flutter pub run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B3D5C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24

# Splash (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#0B3D5C"
  image: assets/icon/splash.png
  color_dark: "#04202F"
  image_dark: assets/icon/splash.png
  android: true
  ios: false
  android_12:
    image: assets/icon/splash.png
    icon_background_color: "#0B3D5C"
    image_dark: assets/icon/splash.png
    icon_background_color_dark: "#04202F"
  fullscreen: false
